services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DB_PATH: /app/runtime/ozon_data.db
      REPORTS_DIR: /app/runtime/reports
      ANALYTICS_SNAPSHOT_PATH: /app/runtime/reports/analytics-dashboard.json
    ports:
      - "8000:8000"
    volumes:
      - ozon_runtime:/app/runtime
    command: ["python", "-m", "uvicorn", "web:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      DB_PATH: /app/runtime/ozon_data.db
      REPORTS_DIR: /app/runtime/reports
      ANALYTICS_SNAPSHOT_PATH: /app/runtime/reports/analytics-dashboard.json
    volumes:
      - ozon_runtime:/app/runtime
    command: ["python", "main.py"]
    restart: unless-stopped

volumes:
  ozon_runtime:

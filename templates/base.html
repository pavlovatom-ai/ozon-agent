<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ozon AI Helper</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { transition: background-color .2s ease, color .2s ease; }
        [data-theme="dark"] body { background: #121820; color: #e7edf3; }
        [data-theme="dark"] .navbar { background-color: #080c10 !important; }
        [data-theme="dark"] .card,
        [data-theme="dark"] .bg-light { background-color: #1b2530 !important; color: #e7edf3; }
        [data-theme="dark"] .text-secondary,
        [data-theme="dark"] .text-muted { color: #aebbc8 !important; }
        [data-theme="dark"] .border,
        [data-theme="dark"] .border-bottom { border-color: #3b4a58 !important; }
        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select { background-color: #17212b; color: #e7edf3; border-color: #526170; }
        [data-theme="dark"] .list-group-item { background-color: #1b2530; color: #e7edf3; border-color: #3b4a58; }
        [data-theme="dark"] .table { --bs-table-color: #e7edf3; --bs-table-bg: #1b2530; --bs-table-border-color: #3b4a58; }
        [data-theme="dark"] .table-light { --bs-table-color: #e7edf3; --bs-table-bg: #263544; --bs-table-border-color: #526170; }
        [data-theme="dark"] .table-hover > tbody > tr:hover { --bs-table-accent-bg: #263544; color: #ffffff; }
        [data-theme="dark"] .report-content { color: #e7edf3 !important; }
        [data-theme="dark"] .report-content h1,
        [data-theme="dark"] .report-content h2,
        [data-theme="dark"] .report-content h3 { color: #ffffff; }
        [data-theme="dark"] .report-content th { background: #263544; }
        [data-theme="dark"] .report-content th,
        [data-theme="dark"] .report-content td { border-color: #526170; }
        [data-theme="dark"] .report-content blockquote { background: #202d3a; color: #c4d0db; }
        [data-theme="dark"] .report-content code { background: #263544; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <span class="brand-mark" aria-hidden="true">OA</span>
                <span>Ozon AI Helper</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/settings">Настройки</a></li>
                    <li class="nav-item"><a class="nav-link" href="/instructions">Инструкции</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logs">Вопросы</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reports">Отчёты</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analytics">Аналитика</a></li>
                </ul>
                <button type="button" class="btn btn-outline-light btn-sm ms-auto" id="themeToggle" title="Сменить тему">
                    <span id="themeIcon" aria-hidden="true">☾</span> <span id="themeLabel">Тёмная тема</span>
                </button>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .brand-mark {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border: 2px solid #75bfff;
            border-radius: 9px;
            color: #75bfff;
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .04em;
        }
    </style>
    <script>
        (function () {
            const root = document.documentElement;
            const button = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            const savedTheme = localStorage.getItem('ozon-theme') || 'light';

            function applyTheme(theme) {
                root.dataset.theme = theme;
                const dark = theme === 'dark';
                icon.textContent = dark ? '☀' : '☾';
                label.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
                button.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
            }

            applyTheme(savedTheme);
            button.addEventListener('click', function () {
                const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('ozon-theme', nextTheme);
                applyTheme(nextTheme);
            });
        }());
    </script>
</body>
</html>
